name: CamControl

options:
  bundleIdPrefix: com.local.camcontrol
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple team here, or pick it in Xcode under Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  CamControl:
    type: application
    platform: iOS
    sources:
      - path: CamControl/Sources
      - path: CamControl/Resources
        buildPhase: resources
    info:
      # Generated by XcodeGen from the properties below; not checked in.
      path: CamControl/Support/Info.plist
      properties:
        CFBundleDisplayName: CamControl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSLocalNetworkUsageDescription: >-
          CamControl analyse le réseau local auquel cet appareil est connecté pour
          y trouver vos caméras et communiquer avec elles.
        NSPhotoLibraryAddUsageDescription: >-
          Pour enregistrer les instantanés de vos caméras dans votre photothèque.
        NSBonjourServices:
          - _onvif._tcp
          - _rtsp._tcp
        # Cameras speak plain HTTP on the LAN — that is the ONVIF standard, not a
        # choice this app makes. This exception permits it for private addresses
        # only, and keeps App Transport Security enforced for everything else.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.camcontrol.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  CamControlTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CamControlTests
    dependencies:
      - target: CamControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.camcontrol.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CamControl:
    build:
      targets:
        CamControl: all
        CamControlTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CamControlTests
