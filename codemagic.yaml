definitions:
  scripts:
    - &install_xcodegen
      name: Install XcodeGen
      script: brew install xcodegen
    - &generate_project
      name: Generate the Xcode project
      script: |
        set -e
        # The bundle identifier has to match one registered on the Apple
        # developer account, so it is injected here rather than committed.
        # Anchored on the app target's placeholder: an unanchored pattern also
        # rewrites the test target, leaving two targets sharing one identifier.
        sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER: com.local.camcontrol.app|PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID|" project.yml
        # Codemagic's build counter drives the build number; App Store Connect
        # rejects an upload that reuses one.
        sed -i '' "s|CURRENT_PROJECT_VERSION: .*|CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"|" project.yml
        xcodegen generate
    - &install_pods
      name: Install CocoaPods dependencies
      script: pod install

workflows:

  # ---------------------------------------------------------------------------
  # Compiles the app and nothing else. Needs no Apple account, no certificate
  # and no registered bundle id, so it answers "does this build?" without
  # waiting on App Store Connect paperwork. This is the workflow to run first.
  # ---------------------------------------------------------------------------
  ios-build-check:
    name: CamControl · Compilation
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.example.camcontrol"
        XCODE_WORKSPACE: "CamControl.xcworkspace"
        XCODE_SCHEME: "CamControl"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/app-construction-m7cuc2
          include: true
          source: true

    scripts:
      - *install_xcodegen
      - *generate_project
      - *install_pods
      - name: Build for the simulator, unsigned
        # xcodebuild buries the diagnostics in a thousand lines of progress, and
        # Codemagic shows the tail. The compiler's own errors are repeated at the
        # very end so the failure is readable without scrolling.
        script: |
          set -o pipefail
          if xcodebuild build \
              -workspace "$XCODE_WORKSPACE" \
              -scheme "$XCODE_SCHEME" \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO 2>&1 | tee /tmp/xcodebuild_output.log; then
            echo "Build OK"
          else
            status=$?
            echo ""
            echo "################ COMPILE ERRORS ################"
            grep -E "(error|warning): " /tmp/xcodebuild_output.log \
              | grep -v "Pods/" \
              | sed "s|$CM_BUILD_DIR/||g" \
              | sort -u \
              | head -80
            echo "###############################################"
            exit $status
          fi

    artifacts:
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - hakik2.ramadani@gmail.com
        notify:
          success: false
          failure: true

  # ---------------------------------------------------------------------------
  # Signs, builds and uploads to TestFlight. Started manually: it depends on an
  # app record that only exists once it has been created in App Store Connect,
  # which no API can do for you.
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: CamControl · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Must match, character for character and case for case, the name of the
      # App Store Connect API key in Codemagic (Teams → Integrations → Developer
      # Portal). It is the string shown in the "Select API Key" dropdown, before
      # the "(Key: ...)" suffix — not the key id, and not the key's name in
      # App Store Connect. Used here for the TestFlight upload.
      app_store_connect: "PetMind ASC API"

    environment:
      xcode: latest
      cocoapods: default

      # Signing files come from Codemagic's own store (Teams → Code signing
      # identities), not from the Apple portal.
      #
      # Fetching them from Apple instead — `app-store-connect fetch-signing-files
      # --create` — cannot work with a certificate that already exists: the App
      # Store Connect API only ever returns a certificate's public half, never
      # its private key, so the command stops with "Cannot save Signing
      # Certificates without certificate private key". Getting that path to work
      # means either exporting the key into a CERTIFICATE_PRIVATE_KEY secret, or
      # issuing a second certificate against a fresh key — and Apple caps
      # distribution certificates, so a build that mints one each time runs out.
      # Codemagic already holds this certificate together with its private key.
      ios_signing:
        distribution_type: app_store
        # Must stay identical to BUNDLE_ID below, and to the "Bundle ID" field
        # of the provisioning profile stored in Codemagic — which is not the
        # same thing as that profile's display name.
        bundle_identifier: app.cam.io

      vars:
        # The identifier the stored provisioning profile is issued for.
        BUNDLE_ID: "app.cam.io"
        XCODE_WORKSPACE: "CamControl.xcworkspace"
        XCODE_SCHEME: "CamControl"

    scripts:
      - *install_xcodegen
      - *generate_project
      - *install_pods
      - name: Apply the provisioning profile to the project
        # Runs after xcodegen, because it writes the signing settings into the
        # generated project, and XcodeGen would overwrite them.
        script: xcode-project use-profiles
      - name: Build the IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - hakik2.ramadani@gmail.com
        notify:
          success: true
          failure: true
